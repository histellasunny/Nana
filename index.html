<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf5ff">
  <meta name="description" content="Malaysia and Singapore family travel itinerary, 25 November to 3 December 2026.">
  <title>Malaysia & Singapore · Travel Itinerary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="brandHome" aria-label="Go to home">NANA<span>TRAVEL</span></button>
      <span class="topbar-date">25 NOV — 03 DEC 2026</span>
      <button class="topbar-icon" id="topHome" aria-label="Home">⌂</button>

    <main id="app" aria-live="polite">
      <div class="loading-state"><span class="loading-dot"></span>Preparing your trip...</div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-nav="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-item" data-nav="itinerary"><span class="nav-icon">▦</span><span>Itinerary</span></button>
      <button class="nav-item" data-nav="map"><span class="nav-icon">⌖</span><span>Map</span></button>
      <button class="nav-item" data-nav="memo"><span class="nav-icon">▤</span><span>Memo</span></button>
    </nav>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

</html>
